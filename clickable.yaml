clickable_minimum_required: 8.7.0

builder: cmake
kill: ubmeshcore

# Pin the target so every container build is reproducible and clickable does
# not have to probe the attached device for its architecture.
restrict_arch: arm64
framework: ubuntu-sdk-20.04

# Qt Connectivity dev headers are what find_package(Qt5 ... Bluetooth) needs.
# Clickable installs these once into a derived docker image and caches that
# image, so following builds do not pay for it again.
dependencies_target:
  - qtconnectivity5-dev
  - qtdeclarative5-dev

# 'bluetooth' is a reserved AppArmor policy group: click-review flags it as
# NEEDS REVIEW. That is only relevant for publishing to the OpenStore (it would
# require manual vetting there) - sideloaded packages work fine with it.
ignore_review_errors: true

build_args:
  - -DCMAKE_BUILD_TYPE=Release
  # Enable once src/rust cross-compiles inside the container:
  # - -DUSE_RUST_CORE=ON

# --- Rust core library (currently disabled) --------------------------------
# The clickable container already ships a cargo/rustc toolchain, so the Rust
# cdylib can be built in the same container instead of on the host. Uncomment
# together with -DUSE_RUST_CORE=ON above. Note that src/rust/Cargo.toml has
# path dependencies on ../../../meshcore-info-display, which must be inside
# the mounted project root for this to resolve.
#
# libraries:
#   ubmeshcore_core:
#     builder: rust
#     src_dir: src/rust
#     build_args:
#       - --release
